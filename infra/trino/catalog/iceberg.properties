connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.sqlite.JDBC
iceberg.jdbc-catalog.connection-url=jdbc:sqlite:/tmp/iceberg_catalog.db
iceberg.jdbc-catalog.connection-user=admin
iceberg.jdbc-catalog.connection-password=admin
iceberg.jdbc-catalog.catalog-name=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=s3a://warehouse/iceberg

# S3/MinIO settings
hive.s3.endpoint=http://minio:9000
hive.s3.region=us-east-1
hive.s3.path-style-access=true
hive.s3.aws-access-key=${ENV:MINIO_ROOT_USER}
hive.s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
hive.s3.ssl.enabled=false

# Optional performance knobs
iceberg.file-format=PARQUET
iceberg.max-partitions-per-writer=10