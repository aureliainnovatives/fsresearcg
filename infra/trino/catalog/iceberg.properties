
connector.name=iceberg
iceberg.catalog.type=hive-metastore
iceberg.catalog.warehouse=s3a://warehouse/iceberg

# S3/MinIO settings
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.ssl.enabled=false

# Optional performance knobs
iceberg.file-format=PARQUET
iceberg.max-partitions-per-writer=10
