services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [ core-net ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: ${MINIO_ROOT_USER}
      POSTGRES_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ core-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d metastore" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=${MINIO_ROOT_USER} -Djavax.jdo.option.ConnectionPassword=${MINIO_ROOT_PASSWORD}"
      HIVE_METASTORE_WAREHOUSE_DIR: s3a://warehouse/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9083:9083"
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hive/lib/postgresql-42.7.2.jar:/opt/hive/lib/postgresql-42.7.2.jar
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env
      - ./.env
    networks: [ core-net ]
    restart: unless-stopped

  trino:
    image: trinodb/trino:442
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    environment:
      - "JAVA_TOOL_OPTIONS=-Dhttp.proxyHost= -Dhttp.proxyPort="
    env_file:
      - ../.env
      - ./.env
    depends_on:
      - minio
      - hive-metastore
    networks: [ core-net ]
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3-python3
    container_name: spark
    user: root
    command: [ "bash", "-c", "sleep infinity" ]
    stdin_open: true
    tty: true
    ports:
      - "4040:4040"
    volumes:
      - ../:/app
      - spark_events:/opt/spark-events
    env_file:
      - ../.env
      - ./.env
    depends_on:
      - minio
    networks: [ core-net ]
    restart: unless-stopped

  spark-history:
    image: apache/spark:3.5.3-python3
    container_name: spark-history
    user: root
    depends_on:
      - spark
    ports:
      - "18080:18080"
    volumes:
      - spark_events:/opt/spark-events
    command: [ "bash", "-c", "/opt/spark/sbin/start-history-server.sh && tail -f /opt/spark/logs/*history* || tail -f /dev/null" ]
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/opt/spark-events"
    networks: [ core-net ]
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file:
      - ../.env
      - ./.env
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_WAREHOUSE: ${S3_BUCKET_WAREHOUSE}
      ML_ARTIFACTS_BUCKET: ${ML_ARTIFACTS_BUCKET}
      TRINO_URL: ${TRINO_URL}
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - trino
    networks: [ core-net ]
    restart: unless-stopped

volumes:
  minio_data:
  spark_events: {}
  postgres_data: {}

networks:
  core-net:
    driver: bridge
